<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — drifted downstream</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f5f0e4;
            --ink: #262b24;
            --muted: #83806c;
            --teal: #3e6270;
            --copper: #b05633;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #171a14;
                --ink: #e8e6d9;
                --muted: #8d8a76;
                --teal: #7ba0ad;
                --copper: #d0764a;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            font-family: 'Fraunces', Georgia, serif;
            overflow: hidden;
        }
        .eyebrow {
            font-family: 'IBM Plex Mono', Consolas, monospace;
            font-size: .68rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1.4rem;
        }
        h1 {
            font-weight: 500;
            font-size: clamp(2.2rem, 7vw, 4.2rem);
            line-height: 1.05;
            letter-spacing: -.015em;
            max-width: 16ch;
        }
        h1 em { font-style: italic; font-weight: 400; color: var(--teal); }
        a.back {
            margin-top: 2.2rem;
            font-family: 'IBM Plex Mono', Consolas, monospace;
            font-size: .72rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--copper);
            text-decoration: none;
            border-bottom: 1px solid transparent;
        }
        a.back:hover, a.back:focus-visible { border-bottom-color: var(--copper); }
        /* the current, leaving without this page */
        svg { position: fixed; inset: auto 0 12vh 0; width: 100%; height: 120px; opacity: .5; }
        svg path { fill: none; stroke-width: 1.2; }
    </style>
</head>
<body>
    <p class="eyebrow">Error 404 · page not found</p>
    <h1>This page drifted <em>downstream.</em></h1>
    <a class="back" href="/">← back upstream</a>
    <svg viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,60 C150,40 250,85 400,62 S700,35 850,64 S1100,80 1200,55" stroke="#3e6270" opacity=".55"/>
        <path d="M0,72 C180,55 300,95 460,70 S760,48 900,74 S1120,88 1200,66" stroke="#6e7f58" opacity=".45"/>
        <path d="M0,50 C160,30 280,72 430,52 S740,28 880,56 S1110,70 1200,46" stroke="#b05633" opacity=".5"/>
    </svg>
</body>
</html>
